# Radar Nações da Bola: pautas diárias de futebol para o canal.
# Este arquivo contém o projeto inteiro (versão 6). Quando a versão embutida muda, ele reinstala
# o código em radar/, docs/index.html e tests/. O histórico e as pautas salvas não são apagados.
name: Radar diário

on:
  schedule:
    # Várias tentativas pela manhã (Brasília): a primeira que o GitHub executar faz o trabalho,
    # as seguintes só conferem que o dia já foi feito e encerram em segundos.
    # Minutos "quebrados" fogem do congestionamento das horas cheias.
    - cron: "47 10 * * *"   # 07:47
    - cron: "13 11 * * *"   # 08:13
    - cron: "41 11 * * *"   # 08:41
    - cron: "17 12 * * *"   # 09:17
    - cron: "7 13 * * *"    # 10:07
    - cron: "7 15 * * *"    # 12:07
  workflow_dispatch: {}      # botão "Run workflow"
  push:
    branches: [main]
    paths: [".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Instalar ou atualizar o código
