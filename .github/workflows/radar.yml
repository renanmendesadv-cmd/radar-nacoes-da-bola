      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Rodar radar
        id: radar
        env:
          CHANNEL_HANDLE: "@nacoesdabola"
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          PANEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
        run: |
          set +e
          python -m radar.main
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Salvar código, painel e histórico
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Radar: pautas de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi

      - name: Avisar falha
        if: steps.radar.outputs.code != '0'
        run: |
          echo "::error::Radar terminou com código ${{ steps.radar.outputs.code }} (1 = fontes fora do ar, 2 = falha no e-mail). Veja o log do passo 'Rodar radar'."
          exit 1
