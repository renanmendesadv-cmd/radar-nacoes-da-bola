# Radar Nações da Bola: pautas diárias de futebol para o canal.
# Este arquivo contém o projeto inteiro. Na primeira execução ele instala o código no repositório;
# depois disso, as mudanças em radar/config.py passam a valer normalmente.
name: Radar diário

on:
  schedule:
    - cron: "30 11 * * *"   # 08:30 em Brasília
  workflow_dispatch: {}      # botão "Run workflow"
  push:
    branches: [main]
    paths: [".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar o código (só na primeira execução)
