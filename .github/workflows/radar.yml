# Radar Nações da Bola: pautas diárias de futebol para o canal.
# A partir da versão 8 o código fica só no repositório (pasta radar/): este arquivo apenas roda o radar.
# Para mudar clubes, buscas ou pesos, edite radar/config.py.
name: Radar diário

on:
  schedule:
    # Várias tentativas pela manhã (Brasília): a primeira que o GitHub executar faz o trabalho,
    # as seguintes só conferem que o dia já foi feito e encerram em segundos.
    # Minutos "quebrados" fogem do congestionamento das horas cheias.
    - cron: "47 10 * * *"   # 07:47
    - cron: "13 11 * * *"   # 08:13
    - cron: "41 11 * * *"   # 08:41
    - cron: "17 12 * * *"   # 09:17
    - cron: "7 13 * * *"    # 10:07
    - cron: "7 15 * * *"    # 12:07
  workflow_dispatch:         # botão "Run workflow"
    inputs:
      raio_x:
        description: "Gerar também o Raio-X do canal agora (normalmente só às segundas)"
        type: boolean
        default: false
      enviar_email:
        description: "Enviar e-mail"
        type: boolean
        default: true
  push:
    # Mudança de código: roda os testes e atualiza o painel, sem mandar e-mail.
    branches: [main]
    paths: ["radar/**", "tests/**", "docs/index.html", "requirements.txt", ".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Testes (só quando o código muda)
        if: github.event_name == 'push'
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Rodar radar
        id: radar
        env:
          CHANNEL_HANDLE: "@nacoesdabola"
          CHANNEL_ID: ${{ vars.CHANNEL_ID }}
          PANEL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          # Opcionais: sem eles o radar funciona como antes.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RAIOX_PAINEL: ${{ vars.RAIOX_PAINEL || '1' }}
          RAIOX: ${{ inputs.raio_x && '1' || '' }}
          DRY_RUN: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.enviar_email)) && '1' || '' }}
        run: |
          set +e
          python -m radar.main
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Salvar painel e histórico
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A -- docs data
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Radar: pautas de $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            # Se alguém salvou algo no repositório durante a execução, junta antes de enviar.
            git pull --rebase --autostash origin main || true
            git push
          fi

      - name: Avisar falha
        if: steps.radar.outputs.code != '0'
        run: |
          echo "::error::Radar terminou com código ${{ steps.radar.outputs.code }} (1 = fontes fora do ar, 2 = falha no e-mail, 3 = falha no Raio-X do canal; as pautas do dia saíram). Veja o log do passo 'Rodar radar'."
          exit 1
