# Radar Nações da Bola: pautas diárias de futebol para o canal.
# Este arquivo contém o projeto inteiro (versão 3). Quando a versão embutida muda, ele reinstala
# o código em radar/, docs/index.html e tests/. O histórico e as pautas salvas não são apagados.
name: Radar diário

on:
  schedule:
    - cron: "30 11 * * *"   # 08:30 em Brasília
  workflow_dispatch: {}      # botão "Run workflow"
  push:
    branches: [main]
    paths: [".github/workflows/radar.yml"]

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

